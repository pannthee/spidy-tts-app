<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Edge TTS Voice Test</title>
<style>body{background:#0a0a10;color:#eee;font-family:system-ui,sans-serif;margin:0;padding:16px}
h1{font-size:20px;margin:0 0 4px} p{color:#999;font-size:14px;margin:0 0 12px}
#status{font-size:18px;font-weight:700;padding:10px;border-radius:8px;background:#14141c;margin-bottom:12px}
#status.done{background:#12351a;color:#7dff9b} #status.running{background:#3a2a00;color:#ffd24d}
table{width:100%;border-collapse:collapse;font-size:14px} th,td{border:1px solid #333;padding:6px 8px;text-align:left;vertical-align:middle}
th{background:#1c1c26} tr.ok td{color:#b7ffbe} tr.zero td{color:#ff9d9d} tr.err td{color:#ffcf5c}
audio{width:180px;height:32px} button{font-size:16px;padding:10px 18px;border-radius:8px;border:0;background:#E8262D;color:#fff;font-weight:700}

@media(max-width:640px){table,thead,tbody,th,td,tr{display:block}thead{display:none}td{border:0;border-bottom:1px solid #222}td:before{content:attr(data-l)": ";color:#888}tr{border:1px solid #333;margin-bottom:10px;display:block}}
</style></head><body>
<h1>Edge TTS Voice Test — Myanmar text</h1>
<p>Text: မင္ဂလာပါ။ ကျွန္တော်က သီဟ ဖြစ္ပါတ္သယ္။ (36 chars). Each test opens one WebSocket to Microsoft Edge, sends plain or lang-tagged SSML, reports audio bytes.</p>
<div id="status" class="running">RUNNING…</div>
<button id="runBtn" disabled>Run again</button>
<table><thead><tr><th>Voice</th><th>Mode</th><th>Bytes</th><th>Seconds</th><th>Status</th><th>Audio</th></tr></thead><tbody id="rows"></tbody></table>
<div id="log"></div>
<script>
// Sec-MS-GEC v2 token — faithful JS port of edge-tts (current master)
// src/edge_tts/drm.py: generate_sec_ms_gec_v2 + _token_hash + _cs64_digest
// + the custom SHA-256 variant (_sha256_digest/_sha256_init/_sha256_rounds).
// NOTE: the v2 hash is NOT standard SHA-256 (adjusted round constants and
// sigma terms), so WebCrypto cannot be used here. All arithmetic is BigInt
// to match Python's arbitrary-precision ints exactly.

const MASK = 0xFFFFFFFFn
const WIN_EPOCH = 11644473600 // seconds between 1601-01-01 and 1970-01-01

const SHA256_INITIAL = [1779033703n, 3144134277n, 1013904242n, 2773480762n, 1359893119n, 2600822924n, 528734635n, 1541459225n]
const SHA256_STATE = [4255104674n, 2435071207n, 3192492180n, 3442351626n, 1811967817n, 79508907n, 4272990180n, 66059218n]
const SHA256_SCHEDULE = [3945054110n, 358115615n, 2696978146n, 217723578n, 2787307148n, 3520959633n, 3235718560n, 4192668342n, 4039316851n, 1884868174n, 1904797190n, 15051571n, 3529027680n, 1920361828n]
const SHA256_ROUND_CONSTANTS = [1116352408n, 1899447441n, 3049323471n, 3921009573n, 961987163n, 1508970993n, 2453635748n, 2870763221n, 3624381080n, 310598401n, 607225278n, 1426881987n, 1925078388n, 2162078206n, 2614888103n, 3248222580n, 3835390401n, 4022224774n, 264347078n, 604807628n, 770255983n, 1249150122n, 1555081692n, 1996064986n, 2554220882n, 2821834349n, 2952996808n, 3210313671n, 3336571891n, 3584528711n, 113926993n, 338241895n, 666307205n, 773529912n, 1294757372n, 1396182291n, 1695183700n, 1986661051n, 2177026350n, 2456956037n, 2730485921n, 2820302411n, 3259730800n, 3345764771n, 3516065817n, 3600352804n, 4094571909n, 275423344n, 430227734n, 506948616n, 659060556n, 883997877n, 958139571n, 1322822218n, 1537002063n, 1747873779n, 1955562222n, 2024104815n, 2227730452n, 2361852424n, 2428436474n, 2756734187n, 3204031479n, 3329325298n]
const SHA256_ADJUSTMENT = 0xC9DC06A7n
const SHA256_SIGMA0_ADJUSTMENT = 0x059C0B80n
const SHA256_SIGMA1_ADJUSTMENT = 0x000B92C0n
const SHA256_BLOCK_CONSTANTS = [...SHA256_ROUND_CONSTANTS.slice(0, 14), SHA256_ADJUSTMENT, ...SHA256_ROUND_CONSTANTS.slice(15)]

const CS64_COEFFICIENTS = [[3895366065n, 3005677776n], [1155409094n, 2296378653n], [1005282748n, 693190712n], [3365689651n, 3005795295n], [2367603217n, 3557143765n], [827258325n, 652566332n], [3911487921n, 1618477510n], [4037392853n, 2192753147n], [101076211n, 4199654362n], [3665427040n, 545047652n], [3201434976n, 1010595059n], [2314848760n, 3536931681n], [905590982n, 3137643201n], [3410617286n, 3311559015n]]
const CS64_FACTOR = 0x82893933n
const CS64_ADJUSTMENT0 = 0xF2F90B1An
const CS64_ADJUSTMENT1 = 0x0B1A0000n

function rol16(value) {
  const v = value & MASK
  return ((v << 16n) | (v >> 16n)) & MASK
}

function wordsLe4Even(data) {
  // data: Uint8Array. Prepend is done by caller; here just pad + LE unpack.
  const paddedLen = data.length + ((-data.length) % 4 + 4) % 4
  const padded = new Uint8Array(paddedLen)
  padded.set(data)
  const words = []
  for (let i = 0; i < paddedLen; i += 4) {
    words.push(BigInt(padded[i]) | (BigInt(padded[i + 1]) << 8n) | (BigInt(padded[i + 2]) << 16n) | (BigInt(padded[i + 3]) << 24n))
  }
  if (words.length % 2 === 1) words.push(0n)
  return words
}

function sigma0(value) {
  return ((value >> 7n) ^ (value << 25n) ^ (value >> 18n) ^ (value << 14n) ^ (value >> 3n)) & MASK
}

function sigma1(value) {
  return ((value >> 17n) ^ (value << 15n) ^ (value >> 19n) ^ (value << 13n) ^ (value >> 10n)) & MASK
}

function sha256Rounds(state, words, firstRound = 0) {
  let [a, b, c, d, e, f, g, h] = state
  const constants = firstRound === 14 ? SHA256_BLOCK_CONSTANTS : SHA256_ROUND_CONSTANTS
  for (let index = firstRound; index < 64; index++) {
    const rotE = e * 0x100000001n
    const rotA = a * 0x100000001n
    const t1 =
      h +
      ((rotE >> 6n) ^ (rotE >> 11n) ^ (rotE >> 25n)) +
      (g ^ (e & (f ^ g))) +
      constants[index] +
      words[index]
    const t2 =
      ((rotA >> 2n) ^ (rotA >> 13n) ^ (rotA >> 22n)) +
      ((a & b) | (c & (a | b)))
    const newA = (t1 + t2) & MASK
    const newE = (d + t1) & MASK
    h = g
    g = f
    f = e
    e = newE
    d = c
    c = b
    b = a
    a = newA
  }
  return [a, b, c, d, e, f, g, h]
}

function expandSha256Schedule(words, firstWord = 16) {
  for (let index = firstWord; index < 64; index++) {
    const x = words[index - 2]
    const y = words[index - 15]
    const s1 = (x >> 17n) ^ (x << 15n) ^ (x >> 19n) ^ (x << 13n) ^ (x >> 10n)
    const s0 = (y >> 7n) ^ (y << 25n) ^ (y >> 18n) ^ (y << 14n) ^ (y >> 3n)
    words.push((s1 + words[index - 7] + s0 + words[index - 16]) & MASK)
  }
}

function sha256Init(data) {
  // data: Uint8Array of length 7
  const words = new Array(14).fill(0n)
  words.push(BigInt((data[0] << 16) | (data[1] << 8) | data[2]))
  words.push(BigInt((((data[3] << 24) | (data[4] << 16) | (data[5] << 8) | data[6]) >>> 0)))
  for (let index = 16; index < 30; index++) {
    let value = SHA256_SCHEDULE[index - 16]
    if (index - 2 >= 14) {
      value += index === 16 ? sigma1(words[index - 2]) ^ SHA256_SIGMA1_ADJUSTMENT : sigma1(words[index - 2])
    }
    if (index - 7 >= 14) value += words[index - 7]
    if (index - 15 >= 14) {
      value += index === 29 ? sigma0(words[index - 15]) ^ SHA256_SIGMA0_ADJUSTMENT : sigma0(words[index - 15])
    }
    words.push(value & MASK)
  }
  words.push(
    (sigma1(words[28]) + words[23] + sigma0(words[15]) + words[14] + SHA256_ADJUSTMENT - SHA256_ROUND_CONSTANTS[14]) & MASK
  )
  expandSha256Schedule(words, 31)
  const working = sha256Rounds(SHA256_STATE, words, 14)
  return SHA256_INITIAL.map((x, i) => (x + working[i]) & MASK)
}

function sha256Digest(data) {
  // data: Uint8Array, length >= 7. Returns 32-byte Uint8Array.
  if (data.length < 7) throw new Error('Token salt must contain at least seven bytes')
  const length = 57 + data.length
  const zeroCount = (((55 - length) % 64) + 64) % 64
  const paddedLen = data.length - 7 + 1 + zeroCount + 8
  const padded = new Uint8Array(paddedLen)
  padded.set(data.subarray(7), 0)
  padded[data.length - 7] = 0x80
  const bitLen = BigInt(length) * 8n
  for (let i = 0; i < 8; i++) padded[paddedLen - 8 + i] = Number((bitLen >> BigInt(56 - 8 * i)) & 0xFFn)
  let state = sha256Init(data.subarray(0, 7))
  for (let offset = 0; offset < paddedLen; offset += 64) {
    const words = []
    for (let i = 0; i < 16; i++) {
      const o = offset + i * 4
      words.push(BigInt((((padded[o] << 24) | (padded[o + 1] << 16) | (padded[o + 2] << 8) | padded[o + 3]) >>> 0)))
    }
    expandSha256Schedule(words)
    const working = sha256Rounds(state, words)
    state = state.map((x, i) => (x + working[i]) & MASK)
  }
  const out = new Uint8Array(32)
  state.forEach((w, i) => {
    out[i * 4] = Number((w >> 24n) & 0xFFn)
    out[i * 4 + 1] = Number((w >> 16n) & 0xFFn)
    out[i * 4 + 2] = Number((w >> 8n) & 0xFFn)
    out[i * 4 + 3] = Number(w & 0xFFn)
  })
  return out
}

function cs64Digest(data, digest) {
  // data: Uint8Array (str_to_hash bytes); digest: 32-byte Uint8Array.
  let keyA = BigInt((digest[0] | (digest[1] << 8) | (digest[2] << 16) | (digest[3] << 24)) >>> 0)
  let keyB = BigInt((digest[4] | (digest[5] << 8) | (digest[6] << 16) | (digest[7] << 24)) >>> 0)
  keyA |= 1n
  keyB |= 1n
  const factors = [(keyA * CS64_FACTOR) & MASK, (keyB * CS64_FACTOR) & MASK]
  const terms = CS64_COEFFICIENTS.map(([coeff], i) => (coeff * factors[i % 2]) & MASK)
  const offsets = CS64_COEFFICIENTS.map(([, off]) => off)
  const prefixed = new Uint8Array(data.length + 1)
  prefixed[0] = 0
  prefixed.set(data, 1)
  for (const [index, word] of wordsLe4Even(prefixed).entries()) {
    let term = word * (index % 2 === 0 ? keyA : keyB)
    let offset = rol16(word) * (index % 2 === 0 ? 0xEF0569FBn : 0xC31713DBn)
    if (index === 0) {
      term += CS64_ADJUSTMENT0 * factors[0]
      offset += CS64_ADJUSTMENT1
    }
    terms.push(term & MASK)
    offsets.push(offset & MASK)
  }
  let swapAcc = 0n
  let swapLast = 0n
  let state = 0n
  let acc = 0n
  for (let index = 0; index < terms.length; index += 2) {
    const x = terms[index]
    const y = terms[index + 1]
    let t = rol16((offsets[index] + x) & MASK)
    let q = (t * 0x76F50F34n) & MASK
    swapAcc += (rol16(q) * 0xC3EFEA97n + q) & MASK
    t = rol16((offsets[index + 1] + y) & MASK)
    q = (t * 0x1881CE3Cn) & MASK
    swapLast = (rol16(q) * 0x35BD1EC9n + q) & MASK
    swapAcc = (swapAcc + swapLast) & MASK
    state = (state * keyA + x) & MASK
    state = (rol16(state) * 0xCF98B111n) & MASK
    state = (rol16(state) * 0x87085B9Fn) & MASK
    state = (rol16(state) * 0x12CEB96Dn) & MASK
    state = (rol16(state) * 0x257E1D83n) & MASK
    acc += state
    t = (state * keyB + y) & MASK
    t = (rol16(t) * 0xA27416F5n) & MASK
    t = (rol16(t) * 0xD38396FFn) & MASK
    state = (rol16((rol16(t) * 0x7C932B89n) & MASK) * 0xBFA49F69n) & MASK
    acc = (acc + state) & MASK
  }
  return [swapLast ^ state, swapAcc ^ acc]
}

function tokenHash(data) {
  const digest = sha256Digest(data)
  const [c0, c1] = cs64Digest(data, digest)
  const cs64Bytes = new Uint8Array(8)
  for (let i = 0; i < 4; i++) {
    cs64Bytes[i] = Number((c0 >> BigInt(8 * i)) & 0xFFn)
    cs64Bytes[4 + i] = Number((c1 >> BigInt(8 * i)) & 0xFFn)
  }
  const cs64 = [...cs64Bytes].map((b) => b.toString(16).padStart(2, '0')).join('').toUpperCase()
  const sha = [...digest].map((b) => b.toString(16).padStart(2, '0')).join('').toUpperCase()
  return [cs64, sha]
}

// Generates a v2 Sec-MS-GEC token: "<16 hex>-<64 hex>".
// unixTimestamp (seconds, float) is only for testing; defaults to now.
function generateSecMsGecV2(unixTimestamp) {
  let ticks = unixTimestamp === undefined ? Date.now() / 1000 : unixTimestamp
  ticks += WIN_EPOCH
  ticks -= ticks % 300
  ticks *= 1e7 // S_TO_NS / 100
  const strToHash = `${ticks.toFixed(0)}${TRUSTED_TOKEN}`
  const data = new TextEncoder().encode(strToHash)
  const [cs64, sha] = tokenHash(data)
  return `${cs64}-${sha}`
}

const TRUSTED_TOKEN = '6A5AA1D4EAFF4E9FB37E23D68491D6F4'
const SEC_MS_GEC_VERSION = '2-143.0.3650.75' // Chromium 143 (edge-tts current master)

</script>
<script>
const TEXT = '\u1019\u1004\u1039\u1002\u101c\u102c\u1015\u102b\u104b \u1000\u103b\u103d\u1014\u1039\u1010\u1031\u102c\u103a\u1000 \u101e\u102e\u101f \u1016\u103c\u1005\u1039\u1015\u102b\u1010\u1039\u101e\u101a\u1039\u104b';
const TESTS = [
  ['Thiha','my-MM-ThihaNeural','plain'],
  ['Ava','en-US-AvaMultilingualNeural','plain'],
  ['Ava','en-US-AvaMultilingualNeural','langtag'],
  ['Emma','en-US-EmmaMultilingualNeural','plain'],
  ['Emma','en-US-EmmaMultilingualNeural','langtag'],
  ['Florian','de-DE-FlorianMultilingualNeural','plain'],
  ['Florian','de-DE-FlorianMultilingualNeural','langtag'],
  ['Brian','en-US-BrianMultilingualNeural','plain'],
  ['Brian','en-US-BrianMultilingualNeural','langtag'],
  ['Andrew','en-US-AndrewMultilingualNeural','plain'],
  ['Andrew','en-US-AndrewMultilingualNeural','langtag'],
];
const WSS = 'wss://speech.platform.bing.com/consumer/speech/synthesize/readaloud/edge/v1';
const FORMAT = 'audio-24khz-48kbitrate-mono-mp3';
const $ = id => document.getElementById(id);
function log(m){ const t=new Date().toLocaleTimeString(); $('log').textContent += '['+t+'] '+m+'\n'; $('log').scrollTop = 1e9; }
function hex(n){ return [...crypto.getRandomValues(new Uint8Array(n))].map(b=>b.toString(16).padStart(2,'0')).join(''); }
function dateStr(){ const d=new Date(); const days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'], mo=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const p=n=>String(n).padStart(2,'0');
  return days[d.getUTCDay()]+' '+mo[d.getUTCMonth()]+' '+p(d.getUTCDate())+' '+d.getUTCFullYear()+' '+p(d.getUTCHours())+':'+p(d.getUTCMinutes())+':'+p(d.getUTCSeconds())+' GMT+0000 (Coordinated Universal Time)'; }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function ssml(voice, mode){
  const body = mode==='langtag' ? '<lang xml:lang="my-MM">'+esc(TEXT)+'</lang>' : esc(TEXT);
  return "<speak version='1.0' xmlns='http://www.w3.org/2001/10/synthesis' xml:lang='en-US'><voice name='"+voice+"'>"+body+"</voice></speak>";
}
function synth(voice, mode){
  return new Promise((resolve)=>{
    const t0 = Date.now();
    let settled=false;
    const done=(r)=>{ if(!settled){ settled=true; try{ws.close();}catch(e){} resolve(r); } };
    let ws;
    try{
      const url = WSS+'?TrustedClientToken='+TRUSTED_TOKEN+'&Sec-MS-GEC='+generateSecMsGecV2()+'&Sec-MS-GEC-Version='+SEC_MS_GEC_VERSION+'&ConnectionId='+hex(16);
      ws = new WebSocket(url);
    }catch(e){ done({bytes:0, status:'error: '+e.message, blob:null}); return; }
    ws.binaryType='arraybuffer';
    const parts=[];
    const timer=setTimeout(()=>done({bytes:0, status:'timeout 30s', blob:null}), 30000);
    ws.onopen=()=>{
      const cfg='X-Timestamp:'+dateStr()+'\r\nContent-Type:application/json; charset=utf-8\r\nPath:speech.config\r\n\r\n'+JSON.stringify({context:{synthesis:{audio:{metadataoptions:{sentenceBoundaryEnabled:'true',wordBoundaryEnabled:'false'},outputFormat:FORMAT}}}})+'\r\n';
      ws.send(cfg);
      const msg='X-RequestId:'+hex(16)+'\r\nContent-Type:application/ssml+xml\r\nX-Timestamp:'+dateStr()+'Z\r\nPath:ssml\r\n\r\n'+ssml(voice,mode);
      ws.send(msg);
    };
    ws.onmessage=(ev)=>{
      if(typeof ev.data==='string'){
        const path=(/(?:^|\r\n)Path:([^\r\n]+)/.exec(ev.data.split('\r\n\r\n')[0])||[])[1];
        if(path && path.trim()==='turn.end'){
          clearTimeout(timer);
          const total=parts.reduce((a,p)=>a+p.byteLength,0);
          done({bytes:total, status: total>0?'OK':'0 bytes (turn.end, no audio)', blob: total>0?new Blob(parts,{type:'audio/mpeg'}):null});
        }
        return;
      }
      const d=new Uint8Array(ev.data); if(d.length<2) return;
      const hl=(d[0]<<8)|d[1];
      const h=new TextDecoder().decode(d.subarray(2,2+hl));
      if(h.includes('Path:audio') && !h.includes('audio.metadata')) parts.push(d.subarray(2+hl));
    };
    ws.onerror=()=>{ clearTimeout(timer); done({bytes:0, status:'WebSocket error', blob:null}); };
    ws.onclose=(ev)=>{ if(!settled){ clearTimeout(timer); const total=parts.reduce((a,p)=>a+p.byteLength,0); done({bytes:total, status: total>0?'OK (closed early)':'closed code '+ev.code, blob: total>0?new Blob(parts,{type:'audio/mpeg'}):null}); } };
  });
}
async function runAll(){
  $('runBtn').disabled=true;
  $('status').className='running'; $('status').textContent='RUNNING…';
  const tb=$('rows'); tb.innerHTML='';
  const rows=TESTS.map(([name,voice,mode])=>{
    const tr=document.createElement('tr');
    tr.innerHTML='<td data-l="Voice">'+name+'</td><td data-l="Mode">'+mode+'</td><td data-l="Bytes">running…</td><td data-l="Seconds">—</td><td data-l="Status">running…</td><td data-l="Audio"></td>';
    tb.appendChild(tr); return tr;
  });
  for(let i=0;i<TESTS.length;i++){
    const [name,voice,mode]=TESTS[i];
    log('START '+name+' '+mode);
    let r;
    try{ r=await synth(voice,mode); }catch(e){ r={bytes:0,status:'error: '+e.message,blob:null}; }
    const tr=rows[i];
    const secs=(r.bytes/6000).toFixed(1);
    tr.children[2].textContent=r.bytes;
    tr.children[3].textContent=r.bytes>0?secs:'—';
    tr.children[4].textContent=r.status;
    tr.className = r.bytes>0 ? 'ok' : (r.status.startsWith('0 bytes') ? 'zero' : 'err');
    if(r.blob){
      const url=URL.createObjectURL(r.blob);
      tr.children[5].innerHTML='<audio controls preload="none" src="'+url+'"></audio><br><a href="'+url+'" download="'+name+'-'+mode+'.mp3">download mp3</a>';
    }
    log('DONE '+name+' '+mode+' -> '+r.bytes+' bytes, '+r.status);
  }
  $('status').className='done'; $('status').textContent='DONE — all 11 tests finished';
  $('runBtn').disabled=false;
  log('ALL DONE');
}
$('runBtn').addEventListener('click', runAll);
runAll();
</script>
</body></html>
